<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Alternativo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Formulario de Registro</h2>
    <form id="formulario">
        <!-- Nombre -->
        <div>
            <label>Nombre:</label>
            <input type="text" id="nombre">
            <small id="msgNombre" class="mensaje"></small>
        </div>

        <!-- Correo -->
        <div>
            <label>Correo:</label>
            <input type="text" id="correo">
            <small id="msgCorreo" class="mensaje"></small>
        </div>

        <!-- Contraseña -->
        <div>
            <label>Contraseña:</label>
            <input type="password" id="clave">
            <small id="msgClave" class="mensaje"></small>
        </div>

        <!-- Confirmación -->
        <div>
            <label>Confirmar contraseña:</label>
            <input type="password" id="confirmar">
            <small id="msgConfirmar" class="mensaje"></small>
        </div>

        <!-- Edad -->
        <div>
            <label>Edad:</label>
            <input type="number" id="edad">
            <small id="msgEdad" class="mensaje"></small>
        </div>

        <!-- Botones -->
        <button type="submit" id="btnEnviar" disabled>Enviar</button>
        <button type="reset">Reiniciar</button>
    </form>

    <script src="formulario.js"></script>
</body>
</html>
