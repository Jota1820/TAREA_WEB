<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Web Interactiva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MiProyecto</a>
            <div class="navbar-nav">
                <a class="nav-link" href="#inicio">Inicio</a>
                <a class="nav-link" href="#productos">Productos</a>
                <a class="nav-link" href="#contacto">Contacto</a>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <section id="inicio" class="mb-5">
            <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner rounded">
                    <div class="carousel-item active">
                        <img src="https://picsum.photos/id/1/1200/400" class="d-block w-100" alt="Slide 1">
                    </div>
                    <div class="carousel-item">
                        <img src="https://picsum.photos/id/2/1200/400" class="d-block w-100" alt="Slide 2">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-content="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-content="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </section>

        <div class="text-center mb-5">
            <button id="btnAlerta" class="btn btn-primary btn-lg">¡Presióname!</button>
        </div>

        <section id="productos" class="mb-5">
            <h3>Nuestros Productos</h3>
            <table class="table table-hover table-striped border shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Precio</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>01</td><td>Laptop Pro</td><td>$1200</td></tr>
                    <tr><td>02</td><td>Mouse Gamer</td><td>$45</td></tr>
                    <tr><td>03</td><td>Teclado Mecánico</td><td>$80</td></tr>
                </tbody>
            </table>
        </section>

        <section id="contacto" class="mb-5 p-4 border rounded bg-light">
            <h3>Contacto</h3>
            <form id="contactForm">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Tu nombre">
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mensaje</label>
                    <textarea id="mensaje" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Enviar Mensaje</button>
            </form>
            <div id="errorMsg" class="mt-3 text-danger fw-bold"></div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>© 2026 Mi Web Interactiva - <a href="#" class="text-info">Instagram</a> | <a href="#" class="text-info">Twitter</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
