<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Galería Simple</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="p-4">

  <div class="container">
    <h1 class="text-center">Mi Galería Dinámica</h1>
    <p class="text-center text-muted">Pega una URL y añade fotos</p>

    <div class="row g-2 justify-content-center">
      <div class="col-md-6">
        <input type="url" id="urlImagen" class="form-control" placeholder="Pega el link de la imagen ">
      </div>
      <div class="col-auto">
        <button id="btnAgregar" class="btn btn-success">Agregar</button>
      </div>
      <div class="col-auto">
        <button id="btnEliminar" class="btn btn-danger">Eliminar Seleccionada</button>
      </div>
    </div>

    <hr>

    <div id="contenedorGaleria" class="galeria-grid">
      </div>
  </div>
  <footer class="container text-center py-4 border-top">
    <p>&copy; 2025 Mi Sitio </p>
  </footer>

  <script src="codigo.js"></script>
</body>
</html>
